name: Build Cordova Android APK

on:
  push:
    branches:
      - feature/riwayat-teks-footer-fix
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Install dependencies
        working-directory: apk-cordova
        run: npm ci

      - name: Prepare platform
        working-directory: apk-cordova
        run: npx cordova prepare android

      - name: Build debug APK
        working-directory: apk-cordova
        run: npx cordova build android --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: apk-cordova/platforms/android/app/build/outputs/apk/debug/app-debug.apk