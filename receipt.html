<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resi Parkir - Parkmate Gandaria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <style>
    @media print {
      body {
        background: white !important;
        color: black !important;
      }

      .bg-animated,
      .actions,
      .page-header,
      .site-footer {
        display: none !important;
      }

      .container {
        padding: 0;
        margin: 0;
        max-width: 100%;
        min-height: auto;
      }

      .card {
        box-shadow: none !important;
        border: none !important;
        background: white !important;
        padding: 0 !important;
      }

      /* Override dark mode text */
      .receipt-wrapper {
        background: white !important;
        border: 1px dashed #ccc !important;
        color: black !important;
      }

      .receipt-header-row {
        border-bottom-color: #eee !important;
      }

      .data-table th,
      .data-table td,
      .data-table tfoot td {
        color: black !important;
        border-color: #eee !important;
      }

      .text-secondary,
      .text-accent {
        color: #555 !important;
      }
    }
  </style>
</head>

<body>
  <div class="bg-animated">
    <div class="blob shape-1"></div>
    <div class="blob shape-2"></div>
    <div class="blob shape-3"></div>
  </div>

  <main class="container">
    <header class="page-header slide-in-bottom">
      <div class="brand">GANDARIA CITY</div>
      <h1>Resi Pembayaran</h1>
    </header>

    <div class="actions" style="margin-top:0; margin-bottom: 24px; justify-content: space-between;">
      <a href="index.html" class="btn btn-ghost" style="width: auto;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" style="margin-right:8px;">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Kembali
      </a>
      <button id="printBtn" class="btn btn-primary" style="width: auto;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" style="margin-right:8px;">
          <polyline points="6 9 6 2 18 2 18 9"></polyline>
          <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
          <rect x="6" y="14" width="12" height="8"></rect>
        </svg>
        Cetak Resi
      </button>
    </div>

    <section class="card fade-in" style="animation-delay: 0.1s;">
      <div id="receiptContainer"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2025 Daffa Rizki Ariyanto • Gandaria City</p>
  </footer>

  <script src="script.js"></script>
  <script>
    function padB64(s) {
      const padLen = (4 - (s.length % 4)) % 4;
      return s + "=".repeat(padLen);
    }

    function fromBase64UrlToJson(b64url) {
      const raw = (b64url || "").trim();
      const attempts = [
        () => atob(padB64(raw.replace(/-/g, "+").replace(/_/g, "/"))),
        () => atob(padB64(raw)),
      ];
      for (const decode of attempts) {
        try {
          const str = decode();
          const jsonStr = decodeURIComponent(escape(str));
          return JSON.parse(jsonStr);
        } catch (e) {
          /* ignore */
        }
      }
      return null;
    }

    function init() {
      const params = new URLSearchParams(window.location.search);
      const b64url = params.get("data");
      const container = document.getElementById("receiptContainer");
      const printBtn = document.getElementById("printBtn");

      if (!b64url) {
        container.innerHTML = `
            <div style="text-align:center; padding: 40px 20px;">
              <p style="color:var(--text-secondary); margin-bottom:16px;">
                Data resi tidak valid atau tidak ditemukan url param.
              </p>
              <a href="index.html" class="btn btn-ghost" style="width:auto;">Kembali ke Beranda</a>
            </div>
          `;
        return;
      }

      const data = fromBase64UrlToJson(b64url);
      if (!data) {
        container.innerHTML = `<p style="text-align:center; color:var(--text-secondary);">Gagal mengurai data resi dari tautan.</p>`;
        return;
      }

      // Handle legacy schema by bridging to buildReceipt logic where possible
      // Current requirement: We have `buildReceipt` in script.js that takes { breakdown, entry, exit }
      // The QR format (b64url) holds different flat keys. Re-hydrate simplified version.

      const computeDurationParts = (d) => {
        const entry = new Date(d.entry || d.masuk);
        const exit = new Date(d.exit || d.keluar);
        const totalMinutes = Math.floor((exit - entry) / 60000) || d.durasi_menit || d.totalMinutes || 0;
        return {
          totalMinutes,
          durHoursRem: Math.floor(Math.floor(totalMinutes / 60) % 24),
          durMins: totalMinutes % 60,
          durDays: Math.floor(Math.floor(totalMinutes / 60) / 24),
          hourlyRows: [
            { label: "Berdasarkan Tarif", unit: d.metode || "Sistem", subtotal: d.total || 0 }
          ],
          totalCharge: d.total || 0
        };
      };

      const breakdown = computeDurationParts(data);
      const entry = new Date(data.entry || data.masuk || new Date());
      const exit = new Date(data.exit || data.keluar || new Date());

      container.innerHTML = buildReceipt({ breakdown, entry, exit });

      if (printBtn) {
        printBtn.addEventListener("click", () => window.print());
      }
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>

</html>
